services:
  db:
    image: postgres:16
    container_name: chat_db
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5433:5432"
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: chat_redis
    ports:
      - "6377:6379"

volumes:
  chat_pgdata:
