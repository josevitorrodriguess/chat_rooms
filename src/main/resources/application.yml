server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/chatdb
    username: chat
    password: chat

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-chars-min}
    expirationMinutes: 120

  rate-limit:
    messages-per-second: ${APP_RATE_LIMIT_MESSAGES_PER_SECOND:5}

  presence:
    ttl-seconds: 60
